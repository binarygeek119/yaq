name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: node22-linux-x64
            artifact: yaq-linux-x64
          - name: windows-x64
            os: windows-latest
            target: node22-win-x64
            artifact: yaq-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Build client + bundle
        run: |
          npm run build
          npm run build:bundle

      - name: Package binary
        run: npx pkg . --targets ${{ matrix.target }} --output release/${{ matrix.artifact }} --no-bytecode --public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p dist
          cp artifacts/yaq-linux-x64/yaq-linux-x64 dist/yaq-linux-x64
          cp artifacts/yaq-windows-x64/yaq-windows-x64.exe dist/yaq-windows-x64.exe
          chmod +x dist/yaq-linux-x64
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yaq-linux-x64
            dist/yaq-windows-x64.exe
          generate_release_notes: true
