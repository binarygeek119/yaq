name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: node22-linux-x64
            artifact: yaq-linux-x64
          # windows-latest currently ships VS 2026; npm's bundled node-gyp
          # cannot detect it, so better-sqlite3 falls back to a failed rebuild.
          - name: windows-x64
            os: windows-2022
            target: node22-win-x64
            artifact: yaq-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build client + bundle
        run: |
          npm run build
          npm run build:bundle

      - name: Package binary
        run: npx pkg . --targets ${{ matrix.target }} --output release/${{ matrix.artifact }} --no-bytecode --public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p dist
          cp artifacts/yaq-linux-x64/yaq-linux-x64 dist/yaq-linux-x64
          cp artifacts/yaq-windows-x64/yaq-windows-x64.exe dist/yaq-windows-x64.exe
          chmod +x dist/yaq-linux-x64
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Rolling "latest" on main; versioned releases for v* tags.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/yaq-linux-x64
            dist/yaq-windows-x64.exe
